# AI 专家直连转译器 —— Netlify 配置
# 本地 netlify dev 直接使用本文件；CI 部署时由根 netlify.toml(base="ai") 合并读取本配置

[build]
  command = ""
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

# 前端调用 /api/* 时转发到 Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ── .com 域名下代理 Hugo 主站（保持地址栏 .com）─────────────────
# 注意：Hugo 内容只发布在 COS（经 EdgeOne），Netlify 仅做"透明转发"（Edge Function），
#       并按文件类型设置缓存头（HTML: no-cache 用 ETag 验证 / 静态资源: 永久缓存）。
#       部署后由 GitHub Actions 调 EdgeOne purge（invalidate）保证全球节点立即同步。
# 为什么用 Edge Function 而不是 redirects 代理？
#   Netlify 官方限制：[[headers]] 不作用于代理响应；只有 Edge Function
#   才能给代理响应设置缓存头。
[[edge_functions]]
  path = "/philosophy"
  function = "philosophy-proxy"

[[edge_functions]]
  path = "/philosophy/*"
  function = "philosophy-proxy"

# 本地开发：显式指定 dev 命令（可绕过框架自动检测，避免误把根目录 Hugo 站当 dev server）
# netlify dev 在 8888 端口统一入口：/api/* → Functions，其余 → 本静态服务器(8088)
[dev]
  command = "node scripts/dev-server.mjs"
  targetPort = 8088
  autoLaunch = false
  port = 8888
